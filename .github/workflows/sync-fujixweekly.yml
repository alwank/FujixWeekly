name: Sync Fuji X Weekly recipes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import
      - run: npm test
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_BASE_PATH: /FujixWeekly/
      - name: Commit refreshed recipe data
        run: |
          if git diff --quiet -- public/data/recipes.json data/fujixweekly-sync.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/recipes.json data/fujixweekly-sync.json
          git commit -m "chore: sync Fuji X Weekly recipes"
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
